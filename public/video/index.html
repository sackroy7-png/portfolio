<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saisonia — la vidéo</title>
  <meta name="description" content="Saisonia, l'appli emploi des jeunes d'Auvergne : la présentation en vidéo (35 s).">
  <style>
    :root { --bg: #eef2f8; --ink: #0b1220; --blue: #316fdf; --mute: #586071; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1118; --ink: #eef1f7; --mute: #9aa3b4; --blue: #6b9cff; } }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, system-ui, "Segoe UI", Inter, sans-serif;
      display: grid; place-items: center; padding: 24px 16px; }
    main { width: 100%; max-width: 960px; }
    h1 { font-size: clamp(26px, 5vw, 40px); letter-spacing: -0.02em; }
    p { color: var(--mute); margin: 4px 0 18px; }
    video { width: 100%; border-radius: 16px; background: #000; display: block; box-shadow: 0 20px 50px rgba(11, 18, 32, 0.18); }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    a { color: #fff; background: var(--blue); text-decoration: none; padding: 12px 20px; border-radius: 999px; font-weight: 600; }
    a.alt { background: transparent; color: var(--blue); border: 2px solid var(--blue); }
  </style>
</head>
<body>
  <main>
    <h1>Saisonia</h1>
    <p>L'appli emploi des jeunes d'Auvergne — la présentation en 35 secondes (avec le son).</p>
    <video src="saisonia-la-diagonale.mp4" poster="apercu.jpg" controls playsinline preload="metadata"></video>
    <div class="links">
      <a href="../saisonia/">Tester le prototype</a>
      <a class="alt" href="../">Portfolio de Sacha Roy</a>
    </div>
  </main>
</body>
</html>
