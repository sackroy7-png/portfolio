<!doctype html>
<html lang="fr">
  <head>
    <script>
      // Le site s'ouvre toujours en haut : on retire une section (#contact…) d'un lien partagé
      // avant que le navigateur ne saute dessus. Les pages projet (#/projets/…) sont gardées.
      if (location.hash && !location.hash.startsWith("#/")) history.replaceState(null, "", location.pathname + location.search);
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sacha Roy — Marketing digital · E-commerce · Outdoor</title>
    <meta
      name="description"
      content="Portfolio de Sacha Roy, étudiant en BUT Techniques de Commercialisation (marketing digital, e-commerce). Recherche d'un stage de deux mois dans le sport et l'outdoor."
    />
    <meta name="author" content="Sacha Roy" />
    <meta name="theme-color" content="#f3f0e8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Partage sur les réseaux (LinkedIn, messageries).
         Après publication, remplace ./images/og-image.jpg par l'adresse complète,
         ex. https://pseudo.github.io/portfolio/images/og-image.jpg -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Sacha Roy — Marketing digital · E-commerce · Outdoor" />
    <meta property="og:description" content="Étudiant en BUT TC (marketing digital, e-commerce). Projets, expérience chez Decathlon, carnet d’inspirations et CV. Recherche un stage d’avril à mai 2027." />
    <meta property="og:url" content="https://sackroy7-png.github.io/portfolio/" />
    <meta property="og:image" content="https://sackroy7-png.github.io/portfolio/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
