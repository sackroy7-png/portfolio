<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Saisonia — La diagonale</title>
<style>
  @font-face { font-family: "Inter"; src: url("assets/inter-var.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="sv" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// « La diagonale » — 15 s, 120 BPM. Tout l'état visuel est calculé depuis t dans window.seek(t).
const W = 1920, H = 1080, CX = 960, CY = 540, DUR = 15;
const COL = { blue: "#316fdf", teal: "#38bdb4", peach: "#ffaa78", ink: "#0b1220", white: "#ffffff" };

// ---------- Courbes (fonctions du temps, sans état) ----------
const cl = (x) => Math.max(0, Math.min(1, x));
const mix = (a, b, p) => a + (b - a) * p;
const eo = (x) => { x = cl(x); return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const ei = (x) => { x = cl(x); return x <= 0 ? 0 : Math.pow(2, 10 * x - 10); };
const eio = (x) => { x = cl(x); return x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2; };
// Ressort amorti critique (aucun rebond), normalisé pour valoir exactement 1 à « dur ».
const sp = (dt, w) => (dt <= 0 ? 0 : 1 - (1 + w * dt) * Math.exp(-w * dt));
const spn = (dt, dur, w = 18) => cl(sp(dt, w) / sp(dur, w));
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mixC = (a, b, p) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * cl(p))).join(",")})`; };
const f1 = (n) => n.toFixed(1);
const pts = (a) => a.map((p) => f1(p[0]) + "," + f1(p[1])).join(" ");
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// ---------- Défs par image : flous directionnels et masques ----------
let defs = [], uid = 0;
function blur(vx, vy, k = 0.0024, max = 14) {
  const sx = Math.min(max, Math.abs(vx) * k), sy = Math.min(max, Math.abs(vy) * k);
  if (sx < 0.35 && sy < 0.35) return "";
  const id = "f" + uid++;
  defs.push(`<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${sx.toFixed(2)} ${sy.toFixed(2)}"/></filter>`);
  return ` filter="url(#${id})"`;
}
function clipPoly(p) { const id = "c" + uid++; defs.push(`<clipPath id="${id}"><polygon points="${pts(p)}"/></clipPath>`); return ` clip-path="url(#${id})"`; }
function clipRect(x, y, w, h, r = 0) { const id = "c" + uid++; defs.push(`<clipPath id="${id}"><rect x="${f1(x)}" y="${f1(y)}" width="${f1(Math.max(0, w))}" height="${f1(Math.max(0, h))}" rx="${r}"/></clipPath>`); return ` clip-path="url(#${id})"`; }
const DT = 1 / 120;
const vel = (fn, t) => { const a = fn(t), b = fn(t - DT); return [(a[0] - b[0]) / DT, (a[1] - b[1]) / DT]; };
const text = (s, x, y, size, weight, fill, extra = "") =>
  `<text x="${f1(x)}" y="${f1(y)}" font-family="Inter" font-size="${size}" font-weight="${weight}" fill="${fill}"${extra}>${esc(s)}</text>`;

// ---------- Mesures typographiques ----------
const cv = document.createElement("canvas").getContext("2d");
const meas = (s, w, sz) => { cv.font = `${w} ${sz}px Inter`; return cv.measureText(s).width; };

// ---------- Logo : le vrai fichier, coupé le long de sa diagonale ----------
const D = [0.7969, -0.604], N = [0.604, 0.7969];
const ANG = (Math.atan2(D[1], D[0]) * 180) / Math.PI; // -37,2°
const MW = 769 * 0.45, MS = 0.45;
let WORDW, LOCKX, WORDX, WORDB;
const WORD = "Saisonia", WSIZE = 200;

function markState(t) {
  let mx = CX, a = 0, s = 0, wv = 0;
  if (t < 0.5) { mx = mix(LOCKX, CX, spn(t - 0.04, 0.42, 16)); wv = 1 - eo((t - 0.04) / 0.36); }
  else if (t < 1) { const p = spn(t - 0.5, 0.45, 18); a = 60 * p; s = 75 * p; }
  else if (t < 1.5) { a = 60 + 1500 * ei((t - 1) / 0.5); s = 75 + 75 * eo((t - 1) / 0.4); }
  else if (t >= 14 && t < 14.5) { a = 1500 * (1 - eo((t - 14) / 0.5)); s = mix(1100, 40, eo((t - 14) / 0.45)); }
  else if (t >= 14.5) { const p = spn(t - 14.5, 0.45, 16); s = 40 * (1 - p); mx = mix(CX, LOCKX, p); wv = eo((t - 14.55) / 0.4); }
  return { mx, a, s, wv };
}
const halfPos = (t, sign) => { const m = markState(t); return [m.mx + sign * (D[0] * m.a - N[0] * m.s), CY + sign * (D[1] * m.a - N[1] * m.s)]; };
function drawMark(t) {
  const m = markState(t);
  if (m.a > 1450 && t < 2) return "";
  let o = "";
  [1, -1].forEach((sign) => {
    const p = halfPos(t, sign), v = vel((tt) => halfPos(tt, sign), t);
    o += `<g transform="translate(${f1(p[0])},${f1(p[1])}) scale(${MS})"${blur(v[0], v[1])}><image href="assets/logo.png" x="-384.5" y="-400" width="769" height="800" clip-path="url(#${sign > 0 ? "cu" : "cl"})"/></g>`;
  });
  if (m.wv > 0.001) o += `<g${clipRect(WORDX - 10, CY - 200, (WORDW + 30) * m.wv, 400)}>${text(WORD, WORDX, WORDB, WSIZE, 700, COL.ink, ' letter-spacing="-6"')}</g>`;
  return o;
}

// ---------- La bande noire : l'écart du logo, puis la fente des mots ----------
function bandState(t) {
  const m = markState(t);
  if (t >= 0.5 && t < 1.5) {
    const L = t < 1 ? 400 : 400 + 3400 * eo((t - 1) / 0.5);
    return { c: [m.mx, CY], ang: ANG, L, w: 2 * m.s + 26 * cl(m.s / 15) };
  }
  if (t >= 1.5 && t < 2) { const p = spn(t - 1.5, 0.45, 16); return { c: [CX, CY], ang: ANG * (1 - p), L: 3800, w: mix(326, 300, p) }; }
  if (t >= 2 && t < 4) return { c: [CX, CY], ang: 0, L: 3800, w: 300 * (1 - eo((t - 3.75) / 0.22)) };
  if (t >= 14) return { c: [m.mx, CY], ang: ANG, L: 3800, w: 2 * m.s + 26 * cl(m.s / 15) };
  return null;
}
function bandPoly(b) {
  const r = (b.ang * Math.PI) / 180, u = [Math.cos(r), Math.sin(r)], v = [-Math.sin(r), Math.cos(r)];
  const hl = b.L / 2, hw = b.w / 2;
  return [[1, 1], [1, -1], [-1, -1], [-1, 1]].map(([i, j]) => [b.c[0] + u[0] * hl * i + v[0] * hw * j, b.c[1] + u[1] * hl * i + v[1] * hw * j]);
}

// ---------- Mesure 2 : typo cinétique dans la fente ----------
const WSZ = 230, WBASE = CY + (0.727 * WSZ) / 2;
const WORDS = [{ s: "STAGE", c: COL.white }, { s: "ALTERNANCE", c: COL.white }, { s: "JOB D’ÉTÉ", c: COL.peach }, { s: "SAISONNIER", c: COL.white }];
let OINFO = null;
function wordY(i, t) {
  const T = 2 + 0.5 * i; let y = 300 * (1 - spn(t - T, 0.4, 22));
  if (i < 3) y -= 340 * ei((t - T - 0.5) / 0.18);
  return y;
}
function drawWords(t) {
  if (t < 2 || t >= 4.0) return "";
  const b = bandState(t); const bc = clipPoly(bandPoly(b));
  let o = "";
  WORDS.forEach((w, i) => {
    const T = 2 + 0.5 * i;
    if (t < T || (i < 3 && t > T + 0.7)) return;
    const y = wordY(i, t), vy = (wordY(i, t) - wordY(i, t - DT)) / DT;
    const ww = meas(w.s, 900, WSZ), x0 = CX - ww / 2;
    if (i < 3) { o += `<g${bc}><g${blur(0, vy)}>${text(w.s, x0, WBASE + y, WSZ, 900, w.c)}</g></g>`; return; }
    // SAISONNIER : lettre par lettre, tout tombe sauf le O.
    [...w.s].forEach((ch, j) => {
      const x = x0 + meas(w.s.slice(0, j), 900, WSZ);
      if (j === 4) {
        const col = mixC(COL.white, COL.peach, (t - 3.72) / 0.08);
        const g = text(ch, x, WBASE + y, WSZ, 900, col);
        o += t < 3.75 ? `<g${bc}><g${blur(0, vy)}>${g}</g></g>` : g;
        return;
      }
      const fy = (tt) => wordY(3, tt) + 360 * ei((tt - 3.75 - 0.016 * j) / 0.2);
      const vy2 = (fy(t) - fy(t - DT)) / DT;
      o += `<g${bc}><g${blur(0, vy2)}>${text(ch, x, WBASE + fy(t), WSZ, 900, w.c)}</g></g>`;
    });
  });
  return o;
}

// ---------- Mesure 3 : les saisons, une forme qui se transforme ----------
const NS = 240, TH = [...Array(NS)].map((_, i) => -Math.PI / 2 + (2 * Math.PI * i) / NS);
const shEll = (rx, ry) => TH.map((th) => 1 / Math.sqrt((Math.cos(th) / rx) ** 2 + (Math.sin(th) / ry) ** 2));
const shCirc = (R) => TH.map(() => R);
const shTri = (R) => TH.map((th) => { const k = (2 * Math.PI) / 3; const a = (((th + Math.PI / 2) % k) + k) % k - k / 2; return R / 2 / Math.cos(a); });
const shDrop = (R) => TH.map((th) => R * (0.6 + 0.4 * Math.pow(Math.max(0, Math.cos(th + Math.PI / 2)), 2.2)));
const shCard = (a, b, n) => TH.map((th) => Math.pow(Math.pow(Math.abs(Math.cos(th)) / a, n) + Math.pow(Math.abs(Math.sin(th)) / b, n), -1 / n));
const lerpR = (A, B, p) => A.map((v, i) => v + (B[i] - v) * p);
const polar = (r, cx, cy, rotDeg = 0) => { const rr = (rotDeg * Math.PI) / 180; return r.map((v, i) => [cx + v * Math.cos(TH[i] + rr), cy + v * Math.sin(TH[i] + rr)]); };
let MORPHS;
function shapeState(t) {
  // [début, durée, forme d'arrivée, couleur, centre y, sens de rotation]
  let r = MORPHS[0].r, col = COL.peach, cy = CY - 40, rot = 0;
  for (let i = 1; i < MORPHS.length; i++) {
    const M = MORPHS[i], P = MORPHS[i - 1];
    if (t < M.t) break;
    const p = spn(t - M.t, M.d, 20);
    r = lerpR(P.r, M.r, p); col = mixC(P.c, M.c, (p - 0.35) / 0.3);
    cy = mix(P.cy, M.cy, p); rot = M.spin * Math.sin(Math.PI * p);
  }
  return { r, col, cy, rot };
}
const SEASONS = [{ s: "ÉTÉ", t: 4.25 }, { s: "HIVER", t: 4.5 }, { s: "PRINTEMPS", t: 5.0 }];
function drawSeasons(t) {
  if (t < 3.98 || t >= 6) return "";
  let o = "";
  if (t < 4.35) {
    // Le O sort du mot : il grossit, s'épaissit et vient au centre.
    const p = spn(t - 3.98, 0.37, 16), k = mix(1, 2.35, p), sw = 96 * spn(t - 3.98, 0.24, 22);
    const pos = (tt) => { const q = spn(tt - 3.98, 0.37, 16); return [mix(OINFO.cx, CX, q), mix(OINFO.cy, CY - 40, q)]; };
    const c = pos(t), v = vel(pos, t);
    o += `<g transform="translate(${f1(c[0])},${f1(c[1])}) scale(${k.toFixed(3)}) translate(${f1(-OINFO.cx)},${f1(-OINFO.cy)})"${blur(v[0], v[1])}>` +
      text("O", OINFO.x, WBASE, WSZ, 900, COL.peach, ` stroke="${COL.peach}" stroke-width="${sw.toFixed(1)}" stroke-linejoin="round" paint-order="stroke"`) + `</g>`;
  } else {
    const s = shapeState(t);
    o += `<polygon points="${pts(polar(s.r, CX, s.cy, s.rot))}" fill="${s.col}"/>`;
  }
  // Étiquette de saison, en roulement vertical.
  const wy = CY + 300;
  let lab = "";
  SEASONS.forEach((L, i) => {
    const nxt = SEASONS[i + 1] ? SEASONS[i + 1].t : 5.5;
    if (t < L.t || t > nxt + 0.2) return;
    const fy = (tt) => 70 * (1 - spn(tt - L.t, 0.3, 24)) - 80 * ei((tt - nxt) / 0.16);
    const vy = (fy(t) - fy(t - DT)) / DT;
    lab += `<g${blur(0, vy)}>${text(L.s, CX, wy + fy(t), 44, 800, COL.ink, ' text-anchor="middle" letter-spacing="14"')}</g>`;
  });
  o += `<g${clipRect(0, wy - 50, W, 66)}>${lab}</g>`;
  return o;
}

// ---------- Mesure 4 : la carte passe en 3D, se démultiplie, devient des barres ----------
const F = 1500;
const CARD = { a: 330, b: 210 };
const CC = [COL.ink, COL.blue, COL.teal, COL.peach, COL.blue, COL.teal];
const BI = [3, 0, 1, 2, 4, 5]; // carte k → barre
const COUNTS = [3, 2, 3, 3, 3, 1]; // Stage, Alternance, Job d'été, Job étudiant, Saisonnier, Premier emploi (offres du prototype)
const LABELS = [["Stage"], ["Alternance"], ["Job d’été"], ["Job", "étudiant"], ["Saisonnier"], ["Premier", "emploi"]];
const BCOL = [COL.blue, COL.teal, COL.peach, COL.ink, COL.blue, COL.teal];
const BASE = 800, barX = (i) => CX + (i - 2.5) * 190;
function project(p, rx, ry, off) {
  const [x, y, z] = [p[0] + off[0], p[1] + off[1], (p[2] || 0) + off[2]];
  const a = (ry * Math.PI) / 180, b = (rx * Math.PI) / 180;
  const x1 = x * Math.cos(a) + z * Math.sin(a), z1 = -x * Math.sin(a) + z * Math.cos(a);
  const y2 = y * Math.cos(b) - z1 * Math.sin(b), z2 = y * Math.sin(b) + z1 * Math.cos(b);
  const s = F / (F + z2);
  return [CX + x1 * s, CY + y2 * s, z2];
}
const rectPts = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
const circPts = (cx, cy, r) => [...Array(40)].map((_, i) => [cx + r * Math.cos((i / 40) * 2 * Math.PI), cy + r * Math.sin((i / 40) * 2 * Math.PI)]);
const CONTENT = [circPts(-235, -105, 42), rectPts(-170, -135, 170, -100), rectPts(-170, -78, 60, -54), rectPts(-255, 50, -95, 100), rectPts(90, 60, 250, 90)];
function cardState(k, t) {
  let rx, ry;
  if (t < 6.5) { const p = spn(t - 6, 0.45, 16); rx = 50 * p; ry = -28 * p; }
  else if (t < 7) { rx = 50; ry = -28; }
  else { const q = eio((t - 7) / 0.45); rx = mix(50, 28, q); ry = mix(-28, 32, q); }
  const sk = k === 0 ? 1 : spn(t - 6.5 - 0.03 * k, 0.42, 18);
  let off = [-40 * k * sk, -22 * k * sk, 130 * k * sk], a = CARD.a, b = CARD.b, n = 5;
  const pk = spn(t - 7.5 - 0.025 * k, 0.42, 18);
  if (pk > 0) {
    const i = BI[k];
    rx = mix(rx, 0, pk); ry = mix(ry, 0, pk);
    off = [mix(off[0], barX(i) - CX, pk), mix(off[1], BASE - 30 - CY, pk), mix(off[2], 0, pk)];
    a = mix(a, 56, pk); b = mix(b, 30, pk); n = mix(5, 8, pk);
  }
  const cs = t < 7.5 ? spn(t - 6, 0.35, 20) : 1 - ei((t - 7.5) / 0.12);
  return { rx, ry, off, a, b, n, cs };
}
function drawCards(t) {
  if (t < 6 || t >= 8) return "";
  const list = [];
  for (let k = 0; k < 6; k++) {
    if (k > 0 && t < 6.5 + 0.03 * k) continue;
    const s = cardState(k, t);
    const r = shCard(s.a, s.b, s.n);
    const poly = r.map((v, i) => project([v * Math.cos(TH[i]), v * Math.sin(TH[i]), 0], s.rx, s.ry, s.off));
    const depth = project([0, 0, 0], s.rx, s.ry, s.off)[2];
    let g = `<polygon points="${pts(poly)}" fill="${CC[k]}"/>`;
    if (s.cs > 0.01) CONTENT.forEach((c, ci) => {
      const pp = c.map((p) => project([p[0] * s.cs, p[1] * s.cs, 0], s.rx, s.ry, s.off));
      g += `<polygon points="${pts(pp)}" fill="${ci === 3 && k === 0 ? COL.peach : COL.white}"/>`;
    });
    list.push({ depth, g });
  }
  list.sort((p, q) => q.depth - p.depth);
  return list.map((l) => l.g).join("");
}

// ---------- Mesure 5 : les données du prototype ----------
const barH = (i, t) => mix(60, COUNTS[i] * 110, spn(t - 8 - 0.04 * i, 0.42, 18));
function drawData(t) {
  if (t < 8 || t >= 10.2) return "";
  let o = "";
  const dim = (i) => (i === 2 ? 1 : 1 - 0.85 * eo((t - 9) / 0.25));
  for (let i = 0; i < 6; i++) {
    if (i === 2 && t >= 9.5) continue; // la barre Job d'été devient la puce (mesure 6)
    let h = barH(i, t);
    if (t >= 9.5) h *= 1 - ei((t - 9.5 - 0.03 * i) / 0.25);
    if (h < 1) continue;
    const r = shCard(56, h / 2, 8);
    o += `<polygon points="${pts(polar(r, barX(i), BASE - h / 2).map((p, j) => [p[0], p[1]]))}" fill="${BCOL[i]}" fill-opacity="${dim(i).toFixed(3)}"/>`;
    // valeur au-dessus
    const sc = spn(t - 8.1 - 0.04 * i, 0.3, 22);
    if (sc > 0.01 && t < 9.5) o += `<g transform="translate(${f1(barX(i))},${f1(BASE - h - 26)}) scale(${sc.toFixed(3)})" opacity="${dim(i).toFixed(3)}">${text(String(COUNTS[i]), 0, 0, 48, 800, COL.ink, ' text-anchor="middle"')}</g>`;
  }
  // étiquettes sous les barres
  let lab = "";
  LABELS.forEach((ls, i) => {
    const fy = (tt) => 70 * (1 - spn(tt - 8.05 - 0.04 * i, 0.35, 22)) + 90 * ei((tt - 9.5 - 0.03 * i) / 0.2);
    const vy = (fy(t) - fy(t - DT)) / DT;
    ls.forEach((l, li) => { lab += `<g opacity="${dim(i).toFixed(3)}"${blur(0, vy)}>${text(l, barX(i), BASE + 46 + li * 34 + fy(t), 28, i === 2 ? 800 : 600, COL.ink, ' text-anchor="middle"')}</g>`; });
  });
  o += `<g${clipRect(0, BASE + 8, W, 120)}>${lab}</g>`;
  // compteur
  if (t >= 8.5) {
    const fx = (tt) => -700 * (1 - spn(tt - 8.5, 0.4, 18)) - 1000 * ei((tt - 9.5) / 0.3);
    const vx = (fx(t) - fx(t - DT)) / DT, x = 120 + fx(t);
    const roll = (tt) => 240 * spn(tt - 9, 0.35, 22);
    const ry = roll(t), ry2 = ry / 2, vry = (roll(t) - roll(t - DT)) / DT;
    const n15 = Math.round(15 * eo((t - 8.5) / 0.4));
    let num = `<g${blur(0, vry)}>${text(String(n15), x, 330 - ry, 220, 900, COL.ink)}${text("3", x, 330 + 240 - ry, 220, 900, COL.peach)}</g>`;
    let sub = `<g${blur(0, vry)}>${text("offres dans le prototype", x + 6, 400 - ry2, 34, 700, COL.ink)}${text("jobs d’été", x + 6, 400 + 120 - ry2, 34, 700, COL.ink)}</g>`;
    o += `<g${blur(vx, 0)}><g${clipRect(0, 150, 1000, 200)}>${num}</g><g${clipRect(0, 365, 1000, 50)}>${sub}</g>${text("données fictives", x + 6, 446, 28, 500, COL.ink, ' fill-opacity="0.55"')}</g>`;
  }
  return o;
}

// ---------- Mesure 6 : l'interface ----------
const PH = { x0: 1200, y0: 60, x1: 1720, y1: 1020 };
const ROWS = [["Vendeur·se en magasin", "de sport", "Riom · 13 km"], ["Animateur·rice centre", "de loisirs", "Le Puy-en-Velay"], ["Préparateur·rice", "de commandes", "Montluçon"]];
const CHIP = { cx: 1336, cy: 238, a: 100, b: 28 };
function chipState(t) {
  const p = spn(t - 9.5, 0.45, 16);
  const h = COUNTS[2] * 110;
  return { cx: mix(barX(2), CHIP.cx, p), cy: mix(BASE - h / 2, CHIP.cy, p), a: mix(56, CHIP.a, p), b: mix(h / 2, CHIP.b, p), n: mix(8, 6, p), rot: -18 * Math.sin(Math.PI * p) };
}
const rowY = (i, t) => { const base = 300 + i * 170; return i === 0 ? base : base + 270 * spn(t - 10.5, 0.4, 18); };
const rowH = (i, t) => (i === 0 ? mix(150, 420, spn(t - 10.5, 0.4, 18)) : 150);
const rowX = (i, t) => 1236 + 520 * (1 - spn(t - 10 - 0.06 * i, 0.42, 18));
function drawUI(t) {
  if (t < 9.5 || t >= 12.05) return "";
  let o = "";
  // téléphone qui se dessine
  if (t >= 10) {
    const p = eio((t - 10) / 0.45);
    o += `<rect x="${PH.x0}" y="${PH.y0}" width="${PH.x1 - PH.x0}" height="${PH.y1 - PH.y0}" rx="70" fill="none" stroke="${COL.ink}" stroke-width="12" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${(1 - p).toFixed(4)}"/>`;
    const hy = (tt) => 60 * (1 - spn(tt - 10.05, 0.35, 22));
    o += `<g${clipRect(PH.x0, 110, 520, 80)}>${text("Rechercher", 1240, 172 + hy(t), 44, 800, COL.ink)}</g>`;
  }
  // puce « Job d'été » (la barre de données)
  const c = chipState(t), cv2 = vel((tt) => { const q = chipState(tt); return [q.cx, q.cy]; }, t);
  o += `<g${blur(cv2[0], cv2[1])}><polygon points="${pts(polar(shCard(c.a, c.b, c.n), c.cx, c.cy, c.rot))}" fill="${COL.peach}"/></g>`;
  const ls = spn(t - 9.85, 0.25, 24);
  if (ls > 0.01) o += `<g transform="translate(${CHIP.cx},${CHIP.cy + 10}) scale(${ls.toFixed(3)})">${text("Job d’été", 0, 0, 28, 700, COL.ink, ' text-anchor="middle"')}</g>`;
  // lignes d'offres
  if (t >= 10) {
    let rows = "";
    ROWS.forEach((r, i) => {
      const x = rowX(i, t), y = rowY(i, t), h = rowH(i, t), vx = (rowX(i, t) - rowX(i, t - DT)) / DT;
      let g = `<rect x="${f1(x)}" y="${f1(y)}" width="448" height="${f1(h)}" rx="26" fill="${COL.white}" stroke="${COL.ink}" stroke-width="3"/>`;
      g += text(r[0], x + 26, y + 48, 28, 800, COL.ink) + text(r[1], x + 26, y + 82, 28, 800, COL.ink);
      g += text(r[2], x + 26, y + 124, 28, 500, COL.ink, ' fill-opacity="0.6"');
      if (i === 0 && t >= 10.5) {
        const cy0 = y + 130;
        g += `<g${clipRect(x, y, 448, h, 26)}>`;
        g += text("Altitude Sport Riom", x + 26, cy0 + 40, 28, 500, COL.ink, ' fill-opacity="0.6"');
        g += text("11,88 € brut / h", x + 26, cy0 + 84, 28, 800, COL.ink);
        const bx = x + 24, by = y + 300, bw = 400, bh = 84;
        const fw = bw * eo((t - 11) / 0.25);
        const lab = (tt) => 60 * spn(tt - 11.5, 0.3, 22);
        const ly = lab(t);
        const labs = (fill) => `<g${clipRect(bx, by, bw, bh, 42)}>` +
          text(t < 11.08 ? "Postuler" : "Envoyée", bx + bw / 2, by + 54 - ly, 30, 800, fill, ' text-anchor="middle"') +
          text("Entretien · mardi 10 h", bx + bw / 2, by + 54 + 60 - ly, 30, 800, fill, ' text-anchor="middle"') + `</g>`;
        g += `<rect x="${f1(bx)}" y="${f1(by)}" width="${bw}" height="${bh}" rx="42" fill="${COL.white}" stroke="${COL.blue}" stroke-width="4"/>` + labs(COL.blue);
        g += `<g${clipRect(bx, by, fw, bh)}><rect x="${f1(bx)}" y="${f1(by)}" width="${bw}" height="${bh}" rx="42" fill="${COL.blue}"/>${labs(COL.white)}</g>`;
        g += `</g>`;
      }
      rows += `<g${blur(vx, 0)}>${g}</g>`;
    });
    o += `<g${clipRect(PH.x0 + 6, PH.y0 + 6, 508, 948, 64)}>${rows}</g>`;
  }
  // mots à gauche
  const LW = [{ s: "Près de toi.", t: 10 }, { s: "Postuler.", t: 10.5 }, { s: "Envoyée.", t: 11 }, { s: "Entretien.", t: 11.5, c: COL.blue }];
  let lw = "";
  LW.forEach((w, i) => {
    const nxt = LW[i + 1] ? LW[i + 1].t : 99;
    if (t < w.t || t > nxt + 0.2) return;
    const fy = (tt) => 200 * (1 - spn(tt - w.t, 0.4, 22)) - 220 * ei((tt - nxt) / 0.16);
    const vy = (fy(t) - fy(t - DT)) / DT;
    lw += `<g${blur(0, vy)}>${text(w.s, 140, CY + 50 + fy(t), 130, 900, w.c || COL.ink, ' letter-spacing="-4"')}</g>`;
  });
  o += `<g${clipRect(100, CY - 120, 1060, 220)}>${lw}</g>`;
  // le bouton bleu envahit l'image
  if (t >= 11.75) {
    const p = ei((t - 11.75) / 0.25);
    const x = rowX(0, t) + 24, y = rowY(0, t) + 300;
    const r = [mix(x, -40, p), mix(y, -40, p), mix(x + 400, W + 40, p), mix(y + 84, H + 40, p)];
    o += `<rect x="${f1(r[0])}" y="${f1(r[1])}" width="${f1(r[2] - r[0])}" height="${f1(r[3] - r[1])}" rx="${f1(42 * (1 - p))}" fill="${COL.blue}"/>`;
  }
  return o;
}

// ---------- Mesure 7 : le moment fort, des coupes en diagonale ----------
const LAYERS = [
  { t: 12.0, bg: COL.blue, s: "TROUVE", c: COL.white, size: 340 },
  { t: 12.5, bg: COL.teal, s: "TON", c: COL.ink, size: 420 },
  { t: 13.0, bg: COL.peach, s: "JOB", c: COL.ink, size: 440 },
  { t: 13.5, bg: COL.ink, s: "EN AUVERGNE.", c: COL.white, size: 205 },
];
function wipePoly(off) {
  const big = 3200;
  return [
    [CX + D[0] * big + N[0] * off, CY + D[1] * big + N[1] * off],
    [CX - D[0] * big + N[0] * off, CY - D[1] * big + N[1] * off],
    [CX - D[0] * big - N[0] * big, CY - D[1] * big - N[1] * big],
    [CX + D[0] * big - N[0] * big, CY + D[1] * big - N[1] * big],
  ];
}
function layerWord(L, t) {
  const pos = (tt) => { const p = spn(tt - L.t, 0.42, 20); return [CX - D[0] * 260 * (1 - p), CY - D[1] * 260 * (1 - p)]; };
  const p = spn(t - L.t, 0.42, 20), c = pos(t), v = vel(pos, t), sc = mix(1.32, 1, p);
  const ww = meas(L.s, 900, L.size);
  return `<g transform="translate(${f1(c[0])},${f1(c[1])}) scale(${sc.toFixed(3)})"${blur(v[0], v[1])}>${text(L.s, -ww / 2, (0.727 * L.size) / 2, L.size, 900, L.c, ' letter-spacing="-8"')}</g>`;
}
function drawBig(t) {
  if (t < 12 || t >= 14) return "";
  let o = "";
  LAYERS.forEach((L, i) => {
    if (t < L.t) return;
    if (LAYERS[i + 1] && t > LAYERS[i + 1].t + 0.4) return;
    const inner = `<rect x="0" y="0" width="${W}" height="${H}" fill="${L.bg}"/>` + layerWord(L, t);
    if (i === 0) { o += inner; return; }
    const off = mix(-1400, 1400, eio((t - L.t) / 0.34));
    o += `<g${clipPoly(wipePoly(off))}>${inner}</g>`;
  });
  return o;
}
function drawEnd(t) {
  if (t < 14) return "";
  const b = bandState(t), bp = bandPoly(b);
  return `<polygon points="${pts(bp)}" fill="${COL.ink}"/><g${clipPoly(bp)}>${layerWord(LAYERS[3], t)}</g>`;
}

// ---------- Rendu ----------
const sv = document.getElementById("sv");
const STATIC = `<clipPath id="cu"><polygon points="-384.5,-400 384.5,-400 384.5,-289.4 -384.5,293.5"/></clipPath><clipPath id="cl"><polygon points="-384.5,293.5 384.5,-289.4 384.5,400 -384.5,400"/></clipPath>`;
window.seek = (t) => {
  t = ((t % DUR) + DUR) % DUR;
  defs = []; uid = 0;
  let body = `<rect x="0" y="0" width="${W}" height="${H}" fill="${COL.white}"/>`;
  const b = bandState(t);
  if (b && t < 4) body += `<polygon points="${pts(bandPoly(b))}" fill="${COL.ink}"/>`;
  body += drawWords(t) + drawSeasons(t) + drawCards(t) + drawData(t) + drawUI(t) + drawBig(t) + drawEnd(t);
  if (t < 1.5 || t >= 14) body += drawMark(t);
  sv.innerHTML = `<defs>${STATIC}${defs.join("")}</defs>${body}`;
};

async function init() {
  await document.fonts.load("900 230px Inter"); await document.fonts.load("700 200px Inter"); await document.fonts.load("500 28px Inter");
  await document.fonts.ready;
  const img = new Image(); img.src = "assets/logo.png"; await img.decode();
  WORDW = meas(WORD, 700, WSIZE) - 6 * (WORD.length - 1);
  const total = MW + 56 + WORDW;
  LOCKX = CX - total / 2 + MW / 2; WORDX = CX - total / 2 + MW + 56; WORDB = CY + (0.727 * WSIZE) / 2;
  // Position exacte du O de SAISONNIER.
  const ww = meas("SAISONNIER", 900, WSZ), ox = CX - ww / 2 + meas("SAIS", 900, WSZ);
  sv.innerHTML = text("O", ox, WBASE, WSZ, 900, "#000", ' id="otest"');
  const bb = document.getElementById("otest").getBBox();
  OINFO = { x: ox, cx: bb.x + bb.width / 2, cy: bb.y + bb.height / 2, rx: bb.width / 2, ry: bb.height / 2 };
  const k = 2.35, sw = 96;
  MORPHS = [
    { t: 0, r: shEll((OINFO.rx + sw / 2) * k, (OINFO.ry + sw / 2) * k), c: COL.peach, cy: CY - 40, d: 0.1, spin: 0 },
    { t: 4.35, r: shCirc(250), c: COL.peach, cy: CY - 40, d: 0.15, spin: 0 },
    { t: 4.5, r: shTri(320), c: COL.blue, cy: CY - 20, d: 0.42, spin: 24 },
    { t: 5.0, r: shDrop(290), c: COL.teal, cy: CY - 40, d: 0.42, spin: -24 },
    { t: 5.5, r: shCard(CARD.a, CARD.b, 5), c: COL.ink, cy: CY, d: 0.42, spin: 18 },
  ];
  window.seek(0);
}
window.ready = init();

// ---------- Bande-son (Web Audio, OfflineAudioContext) ----------
window.renderAudio = async () => {
  const SR = 48000, ctx = new OfflineAudioContext(2, SR * DUR, SR);
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.12;
  comp.connect(ctx.destination);
  const bus = ctx.createGain(); bus.gain.value = 0.7; bus.connect(comp);
  const nb = ctx.createBuffer(1, SR * 2, SR), nd = nb.getChannelData(0);
  let seed = 12345; for (let i = 0; i < nd.length; i++) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; nd[i] = seed / 0x3fffffff - 1; }
  const env = (g, t, peak, attack, dur) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); };
  const pan = (p) => { const s = ctx.createStereoPanner(); s.pan.value = p; s.connect(bus); return s; };
  const center = pan(0);
  const noise = (t, dur, { type = "highpass", f = 8000, f2 = null, q = 0.7, g = 0.3, attack = 0.002, out = center } = {}) => {
    const s = ctx.createBufferSource(); s.buffer = nb;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const gn = ctx.createGain(); env(gn, t, g, attack, dur);
    s.connect(fl).connect(gn).connect(out); s.start(t, (t * 0.37) % 1); s.stop(t + dur + 0.05);
  };
  const tone = (t, dur, f, f2, g, type = "sine", attack = 0.002, out = center) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.6);
    const gn = ctx.createGain(); env(gn, t, g, attack, dur); o.connect(gn).connect(out); o.start(t); o.stop(t + dur + 0.05);
  };
  const kick = (t, g = 1) => { tone(t, 0.42, 150, 44, g); noise(t, 0.014, { f: 2500, g: 0.22 * g }); };
  const L = pan(-0.35), R = pan(0.35);
  const BAR_NOTES = [55, 43.65, 65.41, 49, 55, 43.65, 73.42, 55];
  for (let n = 0; n < 30; n++) {
    const t = n * 0.5, bar = Math.floor(t / 2);
    kick(t, n % 4 === 0 ? 1 : 0.85);
    noise(t + 0.25, 0.05, { f: 7500, g: 0.16, out: n % 2 ? L : R });
    noise(t + 0.375, 0.03, { f: 9000, g: 0.07, out: n % 2 ? R : L });
    if (n % 2 === 1) noise(t, 0.16, { type: "bandpass", f: 1900, q: 0.9, g: 0.32 });
    // basse pulsée sur le contretemps
    const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = BAR_NOTES[bar] * 2;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420; lp.Q.value = 6;
    const gn = ctx.createGain(); env(gn, t + 0.25, 0.2, 0.01, 0.22);
    o.connect(lp).connect(gn).connect(center); o.start(t + 0.25); o.stop(t + 0.5);
  }
  // impact à chaque changement de scène
  [2, 4, 6, 8, 10, 12, 14].forEach((t) => {
    const big = t === 12;
    tone(t, big ? 1.6 : 0.9, 95, 30, big ? 0.9 : 0.55);
    noise(t, big ? 0.6 : 0.3, { type: "lowpass", f: 4000, f2: 300, g: big ? 0.55 : 0.32 });
  });
  // montée vers la dernière mesure pleine
  const rs = ctx.createBufferSource(); rs.buffer = nb; rs.loop = true;
  const rf = ctx.createBiquadFilter(); rf.type = "bandpass"; rf.Q.value = 2; rf.frequency.setValueAtTime(300, 10); rf.frequency.exponentialRampToValueAtTime(7000, 12);
  const rg = ctx.createGain(); rg.gain.setValueAtTime(0.0001, 10); rg.gain.exponentialRampToValueAtTime(0.42, 11.98); rg.gain.setValueAtTime(0.0001, 12);
  rs.connect(rf).connect(rg).connect(center); rs.start(10); rs.stop(12.01);
  const ro = ctx.createOscillator(); ro.type = "sawtooth"; ro.frequency.setValueAtTime(110, 10); ro.frequency.exponentialRampToValueAtTime(880, 12);
  const rlp = ctx.createBiquadFilter(); rlp.type = "lowpass"; rlp.frequency.setValueAtTime(400, 10); rlp.frequency.exponentialRampToValueAtTime(5000, 12);
  const rog = ctx.createGain(); rog.gain.setValueAtTime(0.0001, 10); rog.gain.exponentialRampToValueAtTime(0.12, 11.98); rog.gain.setValueAtTime(0.0001, 12);
  ro.connect(rlp).connect(rog).connect(center); ro.start(10); ro.stop(12.01);
  // souffles sur les coupes en diagonale, clics sur l'interface, tics du compteur
  [0.5, 1.0, 12.5, 13.0, 13.5, 14.0].forEach((t, i) => noise(t - 0.04, 0.32, { type: "bandpass", f: 500, f2: 4200, q: 1.2, g: 0.22, attack: 0.08, out: i % 2 ? L : R }));
  [10.5, 11.0, 11.5].forEach((t) => tone(t, 0.07, 1600, 1150, 0.22));
  for (let i = 0; i < 15; i++) tone(8.5 + i * 0.027, 0.02, 2600, null, 0.05);
  [4.5, 5.0, 5.5].forEach((t) => tone(t, 0.18, 660, 990, 0.08, "triangle", 0.005));
  const buf = await ctx.startRendering();
  // normalisation à -1 dBFS puis WAV 16 bits
  const ch = [buf.getChannelData(0), buf.getChannelData(1)];
  let peak = 0; ch.forEach((c) => { for (let i = 0; i < c.length; i++) peak = Math.max(peak, Math.abs(c[i])); });
  const gain = 0.89 / (peak || 1), len = buf.length, out = new DataView(new ArrayBuffer(44 + len * 4));
  const ws = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  ws(0, "RIFF"); out.setUint32(4, 36 + len * 4, true); ws(8, "WAVE"); ws(12, "fmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, SR, true); out.setUint32(28, SR * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); ws(36, "data"); out.setUint32(40, len * 4, true);
  for (let i = 0; i < len; i++) for (let c = 0; c < 2; c++) out.setInt16(44 + (i * 2 + c) * 2, Math.max(-1, Math.min(1, ch[c][i] * gain)) * 32767, true);
  const bytes = new Uint8Array(out.buffer); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};
