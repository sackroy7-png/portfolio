<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Couleurs de l'application Saisonia (saisonia/src/styles.css). */
      :root {
        --ground: #eef2f8;
        --ink: #0b1220;
        --secondary: #586071;
        --blue: #316fdf;
        --font-display: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
      /* Halos de l'app, en fond de toute la vidéo. */
      #ground {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(70% 35% at 0% 0%, rgba(49, 111, 223, 0.2), transparent 70%),
          radial-gradient(60% 30% at 100% 10%, rgba(56, 189, 180, 0.14), transparent 70%),
          radial-gradient(60% 30% at 50% 100%, rgba(255, 170, 120, 0.12), transparent 70%),
          var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="27"
      data-width="1080"
      data-height="1920"
    >
      <div id="ground"></div>

      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="3.9"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>

      <div
        id="phone"
        data-composition-id="phone"
        data-composition-src="compositions/phone.html"
        data-start="0"
        data-duration="21.9"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>

      <div
        id="titles"
        data-composition-id="titles"
        data-composition-src="compositions/titles.html"
        data-start="0"
        data-duration="21.5"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>

      <div
        id="end"
        data-composition-id="end"
        data-composition-src="compositions/end.html"
        data-start="21.6"
        data-duration="5.4"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
