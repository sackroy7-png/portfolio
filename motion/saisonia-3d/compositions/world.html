  <script>
    // Temps locaux : cette scène commence à 6 s dans la vidéo.
    const T0 = 6;
    const at = (t) => t - T0;
    const tl = gsap.timeline({ paused: true });
    const GAP = 2400, TILT = [-8, 9, -9, 8, -8, 7];

    // Placement statique : six téléphones en ligne sur le sol, chacun légèrement tourné.
    for (let i = 0; i < 6; i++) {

    }
    gsap.set("#w-floor", { rotationX: 90, y: 458 });
    gsap.set("#w-rig", { transformOrigin: "960px 540px" });
    gsap.set("#p6-toast", { y: -90 });

    // Plans de caméra : arrivée (A), puis un 2e angle plus proche (B) 2 s plus tard.
    // rx/ry : angles (plongée, contre-plongée, côté), z : distance, dy : partie de l'écran visée.
    const STOPS = [
      { t: 7, A: { rx: 0, ry: -14, z: 0 }, B: { rx: -6, ry: 12, z: 260, dy: 0 } },
      { t: 11, A: { rx: -14, ry: 20, z: 80 }, B: { rx: -4, ry: 6, z: 520, dy: -30 } },
      { t: 15, A: { rx: 20, ry: -18, z: 0 }, B: { rx: 10, ry: -6, z: 480, dy: -170 } },
      { t: 19, A: { rx: 4, ry: 32, z: 150 }, B: { rx: 0, ry: 10, z: 520, dy: -95 } },
      { t: 23, A: { rx: -10, ry: -26, z: 120 }, B: { rx: -4, ry: -8, z: 450, dy: 100 } },
      { t: 27, A: { rx: 12, ry: 16, z: 60 }, B: { rx: 2, ry: 4, z: 500, dy: 0 } },
    ];
    const SHIFT = 380;
    const cam = (t, c, i, dur, ease) => {
      tl.to("#w-rig", { rotationX: c.rx, rotationY: c.ry, duration: dur, ease }, at(t));
      tl.to("#w-track", { x: -i * GAP, y: -(c.dy || 0), z: c.z, duration: dur, ease }, at(t));
      tl.to("#w-shift", { x: c.sx === undefined ? SHIFT : c.sx, duration: dur, ease }, at(t));
    };
    // Entrée : vue haute et lointaine, le premier téléphone sort du sol.
    tl.fromTo("#w-rig", { rotationX: 38, rotationY: -30 }, { rotationX: 0, rotationY: -14, duration: 1.2, ease: "power2.inOut" }, at(6.0));
    tl.fromTo("#w-track", { x: 0, y: 0, z: -1200 }, { x: 0, y: 0, z: 0, duration: 1.2, ease: "power2.inOut" }, at(6.0));
    tl.fromTo("#w-shift", { x: 0 }, { x: SHIFT, duration: 1.2, ease: "power2.inOut" }, at(6.0));
    tl.fromTo("#p1", { y: 1100 }, { y: 0, duration: 0.9, ease: "expo.out" }, at(6.15));
    STOPS.forEach((s, i) => {
      if (i > 0) cam(s.t - 0.35, s.A, i, 0.7, "power2.inOut");
      cam(s.t + 2 - 0.25, s.B, i, 0.55, "power2.inOut");
    });

    // Changements d'écran dans chaque téléphone (glissement iOS).
    const SWAPS = [["p1", 1, 8.0], ["p1", 2, 9.0], ["p1", 3, 10.0], ["p3", 1, 16.4], ["p4", 1, 21.2], ["p5", 1, 24.5], ["p5", 2, 25.7]];
    SWAPS.forEach(([p, j, t]) => {
      tl.fromTo(`#${p}-s${j}`, { x: 410 }, { x: 0, duration: 0.45, ease: "power3.out" }, at(t));
      tl.fromTo(`#${p}-s${j - 1}`, { x: 0 }, { x: -130, duration: 0.45, ease: "power3.out" }, at(t));
    });
    // Réponse de l'entreprise.
    tl.fromTo("#p6-toast", { y: -90 }, { y: 0, duration: 0.6, ease: "expo.out" }, at(27.6));
    tl.to("#p6-toast", { y: -90, duration: 0.3, ease: "power3.in" }, at(29.6));

    // 31 s : grand recul en plongée, les six écrans à la suite.
    // les téléphones se rapprochent pour tenir dans le cadre
    for (let i = 0; i < 6; i++) {
      tl.to("#p" + (i + 1), { x: i * 520, rotationY: 0, duration: 0.9, ease: "power2.inOut" }, at(30.75));

    tl.to("#w-rig", { rotationX: 0, duration: 0.55, ease: "power3.in" }, at(32.45));
    tl.to("#w-track", { x: -5 * 520, y: 0, z: 1650, duration: 0.55, ease: "power3.in" }, at(32.45));
    tl.to("#w-shift", { x: 0, duration: 0.55, ease: "power3.in" }, at(32.45));
