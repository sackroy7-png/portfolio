<!doctype html><html><body><script>
window.renderAudio = async () => {
  const DUR = 37, SR = 48000, ctx = new OfflineAudioContext(2, SR * DUR, SR);
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.12;
  comp.connect(ctx.destination);
  const bus = ctx.createGain(); bus.gain.value = 0.7; bus.connect(comp);
  const nb = ctx.createBuffer(1, SR * 2, SR), nd = nb.getChannelData(0);
  let seed = 12345; for (let i = 0; i < nd.length; i++) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; nd[i] = seed / 0x3fffffff - 1; }
  const env = (g, t, peak, attack, dur) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); };
  const pan = (p) => { const s = ctx.createStereoPanner(); s.pan.value = p; s.connect(bus); return s; };
  const center = pan(0);
  const noise = (t, dur, { type = "highpass", f = 8000, f2 = null, q = 0.7, g = 0.3, attack = 0.002, out = center } = {}) => {
    const s = ctx.createBufferSource(); s.buffer = nb;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const gn = ctx.createGain(); env(gn, t, g, attack, dur);
    s.connect(fl).connect(gn).connect(out); s.start(t, (t * 0.37) % 1); s.stop(t + dur + 0.05);
  };
  const tone = (t, dur, f, f2, g, type = "sine", attack = 0.002, out = center) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.6);
    const gn = ctx.createGain(); env(gn, t, g, attack, dur); o.connect(gn).connect(out); o.start(t); o.stop(t + dur + 0.05);
  };
  const kick = (t, g = 1) => { tone(t, 0.42, 150, 44, g); noise(t, 0.014, { f: 2500, g: 0.22 * g }); };
  const L = pan(-0.35), R = pan(0.35);
  const BAR_NOTES = [55, 43.65, 65.41, 49];
  for (let n = 0; n < 74; n++) {
    const t = n * 0.5, bar = Math.floor(t / 2);
    kick(t, n % 4 === 0 ? 1 : 0.85);
    noise(t + 0.25, 0.05, { f: 7500, g: 0.15, out: n % 2 ? L : R });
    if (n % 2 === 1) noise(t, 0.16, { type: "bandpass", f: 1900, q: 0.9, g: 0.28 });
    const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = BAR_NOTES[bar % 4] * 2;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420; lp.Q.value = 6;
    const gn = ctx.createGain(); env(gn, t + 0.25, 0.18, 0.01, 0.22);
    o.connect(lp).connect(gn).connect(center); o.start(t + 0.25); o.stop(t + 0.5);
  }
  // impact à chaque nouveau plan
  [2.5, 6, 7, 11, 15, 19, 23, 27, 31, 33].forEach((t) => {
    const big = t === 33;
    tone(t, big ? 1.6 : 0.8, 95, 30, big ? 0.9 : 0.45);
    noise(t, big ? 0.6 : 0.25, { type: "lowpass", f: 4000, f2: 300, g: big ? 0.55 : 0.26 });
  });
  // souffles sur chaque mouvement de caméra
  const moves = [2.0, 5.8, 6.0, 8.75, 10.65, 12.75, 14.65, 16.75, 18.65, 20.75, 22.65, 24.75, 26.65, 28.75, 30.75, 32.45];
  moves.forEach((t, i) => noise(t, 0.5, { type: "bandpass", f: 400, f2: 3800, q: 1.1, g: 0.2, attack: 0.18, out: i % 2 ? L : R }));
  // crans de l'anneau des contrats, clics d'interface, notification
  for (let k = 0; k < 6; k++) tone(2.5 + 0.5 * k, 0.12, 660 * Math.pow(1.12246, k), null, 0.08, "triangle", 0.004);
  [8.0, 9.0, 10.0, 16.4, 21.2, 24.5, 25.7].forEach((t) => tone(t, 0.07, 1600, 1150, 0.2));
  tone(27.6, 0.25, 880, 1320, 0.12, "triangle", 0.005);
  // montée vers la plongée finale
  const rs = ctx.createBufferSource(); rs.buffer = nb; rs.loop = true;
  const rf = ctx.createBiquadFilter(); rf.type = "bandpass"; rf.Q.value = 2; rf.frequency.setValueAtTime(300, 30.75); rf.frequency.exponentialRampToValueAtTime(7000, 33);
  const rg = ctx.createGain(); rg.gain.setValueAtTime(0.0001, 30.75); rg.gain.exponentialRampToValueAtTime(0.4, 32.98); rg.gain.setValueAtTime(0.0001, 33);
  rs.connect(rf).connect(rg).connect(center); rs.start(30.75); rs.stop(33.01);
  const buf = await ctx.startRendering();
  // normalisation à -1 dBFS puis WAV 16 bits
  const ch = [buf.getChannelData(0), buf.getChannelData(1)];
  let peak = 0; ch.forEach((c) => { for (let i = 0; i < c.length; i++) peak = Math.max(peak, Math.abs(c[i])); });
  const gain = 0.89 / (peak || 1), len = buf.length, out = new DataView(new ArrayBuffer(44 + len * 4));
  const ws = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  ws(0, "RIFF"); out.setUint32(4, 36 + len * 4, true); ws(8, "WAVE"); ws(12, "fmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, SR, true); out.setUint32(28, SR * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); ws(36, "data"); out.setUint32(40, len * 4, true);
  for (let i = 0; i < len; i++) for (let c = 0; c < 2; c++) out.setInt16(44 + (i * 2 + c) * 2, Math.max(-1, Math.min(1, ch[c][i] * gain)) * 32767, true);
  const bytes = new Uint8Array(out.buffer); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};

</script></body></html>
