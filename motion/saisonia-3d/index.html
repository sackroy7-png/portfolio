<!doctype html>
<html lang="fr" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Couleurs de l'application Saisonia. */
      :root {
        --ground: #eef2f8;
        --ink: #0b1220;
        --blue: #316fdf;
        --teal: #38bdb4;
        --peach: #ffaa78;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Inter", sans-serif; }
      #ground {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(60% 50% at 0% 0%, rgba(49, 111, 223, 0.16), transparent 70%),
          radial-gradient(50% 45% at 100% 0%, rgba(56, 189, 180, 0.12), transparent 70%),
          radial-gradient(60% 40% at 50% 100%, rgba(255, 170, 120, 0.1), transparent 70%),
          var(--ground);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="37" data-width="1920" data-height="1080" data-motion-blur="on">
      <div id="ground"></div>

      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="6.7" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>

      <div id="world" data-composition-id="world" data-composition-src="compositions/world.html"
        data-start="6" data-duration="27.4" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="7" data-duration="26" data-track-index="3" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>

      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="33" data-duration="4" data-track-index="4" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 4"></div>

      <audio id="soundtrack" class="clip" data-start="0" data-duration="37" data-track-index="5" data-volume="1" src="assets/soundtrack.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
